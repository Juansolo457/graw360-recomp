# Ghost Recon Advanced Warfighter (Xbox 360), the GR3 program (Instant Action, co-op,
# multiplayer): GR3Xenon_Release.exe on the
# disc (title 555307D5, SHA-256 4d8a0abb93f3867df53e229a54f55435a57b403f65781d5737237ff8c36c023a),
# started by the front end (default.xex, port/) through XamLoaderLaunchTitle when the player picks
# Instant Action (the campaign is yeti_final_xenon.exe, port-yeti/). Same engine and imports as default.xex, different build: its own translation.
# ReXGlue 0.10; scaffolded by `rexglue init`. See docs/FINDINGS.md, "The disc's three programs".

[project]
name = "grawmp"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/GR3Xenon_Release.exe"
out_directory_path = "generated/gr3xenon_release"
includes = []

