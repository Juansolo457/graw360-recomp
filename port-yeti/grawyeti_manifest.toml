# Jump tables the analyser reads wrongly (tools/check_switch_tables.py audits all 388). The HUD
# sprite blend switch in sub_821B8FF8 (blend mode byte at sprite+64, 26 modes) was generated as
# `switch (r8)` with one case: r8 is always 0 there, so every HUD sprite drew SrcAlpha/InvSrcAlpha.
# The Cross-Com and narration overlays need One/InvSrcColor, Zero/InvSrcColor and One/One, and
# drew opaque black instead (#2; also the HUD border static, #1). docs/CROSSCOM.md, "Root cause".
[[entrypoint.switch_tables]]   # in sub_821B8FF8, table 821B91E0
address = 0x821B91DC
register = 7
labels = [
  0x821B924C, 0x821B9248, 0x821B9258, 0x821B9264, 0x821B9274, 0x821B9284,
  0x821B9280, 0x821B9290, 0x821B92A4, 0x821B92A0, 0x821B92B0, 0x821B92C4,
  0x821B92C0, 0x821B92D0, 0x821B92E4, 0x821B92E0, 0x821B92F0, 0x821B9300,
  0x821B930C, 0x821B9318, 0x821B9324, 0x821B9330, 0x821B924C, 0x821B924C,
  0x821B924C, 0x821B924C,
]

