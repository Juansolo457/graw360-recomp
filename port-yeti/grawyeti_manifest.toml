# Ghost Recon Advanced Warfighter (Xbox 360), the campaign: Yeti_Final_Xenon.exe on the disc
# (title 555307D5, SHA-256 32735d0908bd45e965d427de6d1be2f995cb9ef44f6633b5ee7df5f34dbaadfb),
# Ubisoft Paris's Yeti engine with Yeti.big, started by the front end (default.xex, port/) through
# XamLoaderLaunchTitle when the player picks Campaign. ReXGlue 0.10; scaffolded by `rexglue init`.
# See docs/FINDINGS.md, "The disc's three programs".

[project]
name = "grawyeti"
sdk_version = "0.10.0"
game_root = "assets"

[entrypoint]
file_path = "assets/Yeti_Final_Xenon.exe"
out_directory_path = "generated/yeti_final_xenon"
includes = []

# Function entries the analyser misses (tools/find_missed_functions.py), never edits to
# generated code.
