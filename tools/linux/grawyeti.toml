# GRAW 360 recomp - Linux and Steam Deck: the campaign's settings (grawyeti only; the front end and
# Instant Action don't read this file). Same names as the command-line options.
#
# The native Vulkan renderer is on by default in the Linux build (no F9 switch to the emulated
# renderer there). The campaign runs at the 360's 30 fps (graw-linux.sh's 30 Hz vblank).

# A frame log for the performance numbers: one row per frame (frame time, draws, CPU and GPU time,
# pipelines compiled and frames held for them). It stays on this machine, in logs/.
graw_native_csv = "logs/grawyeti-frames.csv"

# The renderer's CPU time per draw split into its stages, as extra columns in the frame log
# (st_<stage>_us). Costs a few percent of the render thread, so it's off for play; on to see
# where the renderer's time goes.
graw_native_profile = false

# The scene is 4x MSAA on the 360, which its EDRAM does for free. On the Steam Deck 2x saves GPU
# time and power where it counts (smoke in firefights: mission 3's final fight 12.8 -> 10.8 ms of
# GPU per frame) at the cost of slightly rougher edges. 4 = as the 360, 1 = none.
graw_native_msaa_max = 2

# GPU time per pass of the frame, logged every few seconds as "GRAW native GPU:" lines (with
# _shaders: draws per vertex/pixel shader pair). Only to find what the GPU spends its time on.
# graw_native_gpu_timing = true
# graw_native_gpu_timing_shaders = true

# Shimmer A/B: the old way of sampling textures whose detail level the shader computes (explicit
# gradients). Only to compare, if there's shimmer: remove the # in front of it.
# graw_native_implicit_gradients = false

# The 30 fps limiter is off (#51): it made frames show up late, 8.5% of them over 40 ms in Deck
# test 11 against test 13's 0.64%. To try it, remove the # in front of both.
# graw_present_interval = 0
# graw_max_fps = 30
